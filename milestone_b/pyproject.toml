[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "milestone-b-slice"
version = "0.1.0"
description = "Milestone B vertical slice — request -> contract -> plan -> edit -> test -> result"
authors = [{ name = "Mohammed Salem Sayed", email = "mohammed.salem.sayed@gmail.com" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
# pulled in on the days that need them (see MILESTONE_B_PLAN.md work breakdown)
llm = ["anthropic>=0.40", "claude-agent-sdk>=0.1"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# durable multi-session event store; SQLite stays the default (stdlib, no dep).
# select Postgres with --db 'postgres://…' or NEXUS_DB_URL. See app/events/pg_log.py.
postgres = ["psycopg[binary]>=3.2"]
# authoring task class — DOCX / PPTX renderers (Milestone M seam) + attachment PDF text
authoring = ["python-docx>=1.1", "python-pptx>=0.6.23", "pypdf>=4.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "security: deterministic control-plane abuse/injection cases",
]
