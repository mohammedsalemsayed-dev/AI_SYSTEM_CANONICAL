<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NEXUS</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; color: #d6e0ea;
      font-family: ui-monospace, Menlo, Consolas, monospace; }
    .wrap { height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; }
    h1 { letter-spacing: 6px; font-size: 22px; margin: 0; }
    .bar { width: 180px; height: 3px; background: #1f2a35; overflow: hidden; border-radius: 2px; }
    .bar i { display: block; width: 40%; height: 100%; background: #4fd1c5;
      animation: slide 1.1s ease-in-out infinite; }
    small { color: #7d8ea0; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NEXUS</h1>
    <div class="bar"><i></i></div>
    <small>starting the control plane&hellip;</small>
  </div>
</body>
</html>
