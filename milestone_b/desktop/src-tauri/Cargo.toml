[package]
name = "nexus-desktop"
version = "0.1.0"
description = "NEXUS native shell"
authors = ["Mohammed Salem Sayed <mohammed.salem.sayed@gmail.com>"]
license-file = "../../../LICENSE"
publish = false
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# used by `tauri dev`
custom-protocol = ["tauri/custom-protocol"]
